name: OpenHarmony port
on:
  pull_request:
    branches: [release-branch.go1.27]
  workflow_dispatch:
    inputs:
      sdk:
        description: Download official public SDK and cross-link both architectures (about 2.3 GB)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  host-and-codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: false
      - name: Bootstrap the modified toolchain
        run: |
          export GOROOT_BOOTSTRAP="$(go env GOROOT)"
          cd src
          ./make.bash
      - name: Platform, build tags, TLS code generation, and API checks
        env:
          GOTOOLCHAIN: local
        run: |
          export PATH="$PWD/bin:$PATH"
          go test internal/platform internal/buildcfg go/build cmd/go/internal/imports cmd/go/internal/modindex cmd/go/internal/cfg cmd/internal/obj cmd/internal/obj/arm64 cmd/internal/obj/x86 cmd/internal/objabi
          go test cmd/api -run '^TestCheck$' -check
          go test cmd/go -run '^TestScript/build_openharmony$'
      - name: Cross-compile runtime Go and assembly (no SDK linking or execution)
        run: |
          for arch in arm64 amd64; do
            GOOS=openharmony GOARCH="$arch" CGO_ENABLED=1 CC=cc ./bin/go build runtime
          done
  sdk-cross-link:
    if: github.event_name == 'workflow_dispatch' && inputs.sdk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: false
      - name: Bootstrap
        run: |
          export GOROOT_BOOTSTRAP="$(go env GOROOT)"
          (cd src && ./make.bash)
      - name: Fetch checksum-verified official SDK
        run: SDK_DOWNLOAD_DIR="$RUNNER_TEMP/ohos-sdk" bash misc/openharmony/download-sdk.sh
      - name: SDK compile, external link and ELF inspection only
        run: |
          export OHOS_NDK_HOME="$(cat "$RUNNER_TEMP/ohos-sdk/native-path.txt")"
          for arch in arm64 amd64; do
            GOARCH="$arch" BUILD_NATIVE_TOOLS=1 bash misc/openharmony/build.sh
          done
      - uses: actions/upload-artifact@v4
        with:
          name: openharmony-compile-only
          path: openharmony-out/
