name: gohmos installer
on:
  pull_request:
    branches: [release-branch.go1.27]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: false
      - name: Installer unit tests
        working-directory: gohmos
        run: go test -v ./...
      - name: Source install, cached reinstall, and host smoke test
        working-directory: gohmos
        env:
          GOHMOS_TEST_REPOSITORY: ${{ github.workspace }}
          GOHMOS_TEST_COMMIT: ${{ github.sha }}
        run: go test -v -run '^TestRealInstallation$' -timeout 25m
